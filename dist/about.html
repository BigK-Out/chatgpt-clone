<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Mirroring and Animation on Hover</title>
    <style>
        #mySVG {
            transition: transform 0.3s ease; /* Smooth transition for the mirroring */
        }

        #mySVG:hover {
            transform: scaleX(-1); /* Flip horizontally on hover */
        }
    </style>
    <script src="anime.min.js"></script>
</head>
<body>
    <svg id="mySVG" width="200" height="200" viewBox="0 0 200 200">
        <circle cx="50" cy="100" r="40" fill="red" />
    </svg>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            anime({
                targets: '#mySVG circle', // Target x-coordinate
                duration: 2000,
                easing: 'easeIn',
                direction: 'alternate', // Play forward and then backward
                 // Repeat indefinitely
            });
        });
    </script>
</body>
</html>
